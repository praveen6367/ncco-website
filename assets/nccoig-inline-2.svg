<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 98" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#2A5B75"/>
      <stop offset="70%" stop-color="#0F2C3D"/>
      <stop offset="100%" stop-color="#050F1A"/>
    </radialGradient>
    <pattern id="mesh" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0,7 L14,7 M7,0 L7,14" stroke="#3D7ABC" stroke-width="0.3" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="178" height="98" fill="url(#bg2)"/>
  <rect width="178" height="98" fill="url(#mesh)"/>
  <!-- Microscopic cells - scattered dots -->
  <g opacity="0.9">
    <!-- Green/teal skin cells -->
    <circle cx="45" cy="35" r="4" fill="#4DBFA3" opacity="0.7"/>
    <circle cx="65" cy="55" r="3" fill="#4DBFA3" opacity="0.6"/>
    <circle cx="95" cy="30" r="5" fill="#5AC9A8" opacity="0.7"/>
    <circle cx="120" cy="60" r="4" fill="#4DBFA3" opacity="0.6"/>
    <circle cx="140" cy="40" r="3" fill="#5AC9A8" opacity="0.7"/>
    <circle cx="30" cy="65" r="3" fill="#4DBFA3" opacity="0.5"/>
    <circle cx="80" cy="75" r="3" fill="#5AC9A8" opacity="0.6"/>
    <circle cx="110" cy="80" r="3" fill="#4DBFA3" opacity="0.5"/>
    <!-- Red/orange particles -->
    <circle cx="55" cy="20" r="2.5" fill="#E85D5D" opacity="0.8"/>
    <circle cx="130" cy="20" r="2" fill="#E85D5D" opacity="0.7"/>
    <circle cx="150" cy="75" r="2.5" fill="#F07A5D" opacity="0.7"/>
    <!-- White glowing cells -->
    <circle cx="75" cy="42" r="1.5" fill="#EAF6FA" opacity="0.9"/>
    <circle cx="105" cy="48" r="1.8" fill="#EAF6FA" opacity="0.85"/>
    <circle cx="88" cy="63" r="1.3" fill="#EAF6FA" opacity="0.8"/>
    <circle cx="125" cy="35" r="1.4" fill="#EAF6FA" opacity="0.85"/>
    <!-- Small teal particles -->
    <circle cx="40" cy="50" r="1" fill="#7FDBC4" opacity="0.7"/>
    <circle cx="60" cy="80" r="1" fill="#7FDBC4" opacity="0.7"/>
    <circle cx="115" cy="20" r="1" fill="#7FDBC4" opacity="0.7"/>
    <circle cx="155" cy="55" r="1" fill="#7FDBC4" opacity="0.7"/>
  </g>
</svg>
